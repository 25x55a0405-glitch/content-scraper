    <script>
      (function () {
        var AMBER = "#8A5A0B";
        var GREEN = "#136B3F";
        var CHROME = "#717A85";

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        window.__timelines["03-catches-its-mistake"] = tl;

        var root = document.querySelector('[data-composition-id="03-catches-its-mistake"]');
        var q = function (s) { return root.querySelector(s); };
        var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

        /* ---------- SCENE 1 (0.0–1.4) : inherited rule drops; sentence writes ---------- */

        // handoff_in: at t=0 the rule is already at y=324 (30%), x 14%–86%, opacity 1,
        // scale 1, static. It then drops to sit directly under the draft sentence and
        // narrows to the handoff_out boundary: y=496.8 (46%), x 14%–62%.
        gsap.set("#cmi-rule", { top: 324, width: 1382.4, opacity: 1 });
        tl.to("#cmi-rule", { top: 496.8, width: 921.6, duration: 1.0, ease: "power2.inOut" }, 0.2);

        tl.fromTo("#cmi-eyebrow", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.0);

        // three written lines — wipe + caret (typing read, spans kept intact)
        var LINES = [
          { line: "#cmi-l1", caret: "#cmi-c1", at: 0.15, dur: 0.48 },
          { line: "#cmi-l2", caret: "#cmi-c2", at: 0.68, dur: 0.38 },
          { line: "#cmi-l3", caret: "#cmi-c3", at: 1.08, dur: 0.30 }
        ];
        LINES.forEach(function (L) {
          tl.fromTo(L.line, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: L.dur, ease: "none" }, L.at);
          tl.fromTo(L.caret, { left: "0%", opacity: 1 }, { left: "100%", duration: L.dur, ease: "none" }, L.at);
          tl.set(L.caret, { opacity: 0 }, L.at + L.dur + 0.04);
        });

        // the empty trail panel establishes alongside
        tl.fromTo("#cmi-panel", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.35);
        tl.fromTo("#cmi-panel-label", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.6);

        /* ---------- SCENE 2 (1.4–2.8) : trail writes + ticks stamp, one bound beat ----- */
        // control-target-sync: the panel line and the surface ticks share ONE label.
        tl.addLabel("check", 1.42);

        tl.set("#cmi-e1", { opacity: 1 }, "check");
        tl.fromTo("#cmi-n1", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power2.out" }, "check");
        tl.fromTo("#cmi-t1", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "none" }, "check");

        var ticks = qa(".cmi-tick");
        ticks.forEach(function (el, i) {
          tl.fromTo(el, { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, 1.42 + i * 0.17);
        });
        tl.fromTo("#cmi-tickcap", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 1.6);

        /* ---------- SCENE 3 (2.8–4.2) : the last tick fails — panel + sentence together -- */
        tl.addLabel("miss", 2.82);

        // the seventh check does not pass: a neutral hairline strikes it out
        tl.to("#cmi-strike", { width: 18, duration: 0.22, ease: "power2.inOut" }, "miss");
        // the wrong figure — the ONLY amber in the sentence
        tl.set("#cmi-fig", { color: AMBER }, "miss");
        // its trail node — the ONLY amber in the panel. Same label: bound, one beat.
        tl.set("#cmi-n1", { borderColor: AMBER, backgroundColor: AMBER }, "miss");
        tl.fromTo("#cmi-b1", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "none" }, 2.9);

        /* ---------- SCENE 4 (4.2–5.8) : THE DWELL — rack out, then stillness ----------- */
        // depth-of-field-blur, focal pull. Only #cmi-fig stays sharp.
        qa(".cmi-plane").forEach(function (el) {
          var d = Number(el.getAttribute("data-depth")) || 1;
          tl.to(el, { "--dof": (3.2 * d) + "px", opacity: 0.55, duration: 0.55, ease: "power2.inOut" }, 4.2);
        });
        // 4.75 → 5.80 : nothing is authored. 1.05s of true stillness, the mistake admitted.

        /* ---------- SCENE 5 (5.8–7.0) : rewrite in place, verify, rack back ------------ */
        // discrete-text-sequence: the figure steps 95.0% → 88.9%. No fade, no count-up.
        var STEPS = [
          { t: 5.80, text: "95.0%" },
          { t: 5.90, text: "95.0" },
          { t: 5.98, text: "95." },
          { t: 6.06, text: "95" },

          { t: 6.50, text: "88." },
          { t: 6.60, text: "88.9" },
          { t: 6.72, text: "88.9%" }
        ];
        var figEl = q("#cmi-fig");
        var driver = { t: 5.80 };
        var lastText = null;
        function stepAt(time) {
          for (var i = STEPS.length - 1; i >= 0; i--) { if (time >= STEPS[i].t) return STEPS[i].text; }
          return STEPS[0].text;
        }
        tl.to(driver, {
          t: 6.78,
          duration: 0.98,
          ease: "none",

            var s = stepAt(driver.t);

        tl.set("#cmi-fig", { color: GREEN }, 6.74);
