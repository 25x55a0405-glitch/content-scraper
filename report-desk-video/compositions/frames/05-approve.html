  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ── closing copy, built word by word so it can write in ───────── */
      var closing = document.getElementById("f5-closing");
      if (closing && !closing.childNodes.length) {
        var words = ["Nothing", "goes", "out", "until", "you", "approve", "it."];
        for (var i = 0; i < words.length; i++) {
          var s = document.createElement("span");
          s.className = "f5-w";
          s.textContent = words[i];
          closing.appendChild(s);
        }
      }

      /* ══ Scene 1 (0.0–1.0s) — control on the baseline, pointer travels in
            from lower-right on a long tail. The rule is inherited: static at
            y=626 / x 192–1728, opacity 1, untouched until Scene 4.        */
      tl.fromTo("#f5-approve",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo("#f5-closing-label",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power3.out" }, 0.1);

      /* cursor-click-ripple, phase 1 — eased move to the control's centre */
      tl.fromTo("#f5-cursor",
        { x: 1588, y: 872, opacity: 0 },
        { opacity: 1, duration: 0.22, ease: "power2.out" }, 0);
      tl.to("#f5-cursor",
        { x: 958, y: 650, duration: 0.88, ease: "power3.out" }, 0.04);

      /* ══ Scene 2 (1.0–1.6s) — the press.
            press-release-spring: LINEAR compression, spring release.
            Adjacency (RELEASE_START = PRESS_START + PRESS_DUR) threads the
            state, so the spring starts exactly at the pressed scale.
            This is the film's only spring — small and tactile.            */
      tl.to("#f5-approve", { scale: 0.93, duration: 0.10, ease: "power1.in" }, 1.00);
      tl.to("#f5-approve", { scale: 1, duration: 0.52, ease: "back.out(1.6)" }, 1.10);

      /* cursor-click-ripple, phase 2 — actor compresses more than recipient */
      tl.to("#f5-cursor", { scale: 0.86, duration: 0.10, ease: "power1.in" }, 1.00);
      tl.to("#f5-cursor", { scale: 1, duration: 0.46, ease: "back.out(1.5)" }, 1.10);

      /* cursor-click-ripple, phase 3 — one quiet ring from the click point */
      tl.fromTo("#f5-ripple",
        { scale: 0.26, opacity: 0.85 },
        { scale: 3.1, opacity: 0, duration: 0.78, ease: "power2.out", immediateRender: false },
        1.08);

      /* ══ Scene 3 (1.6–3.4s) — the report rises from behind the baseline on
            a nudge-curve: ramp-in 10% dist / 20% time (power3.in), burst 65%
            / 18% (linear), tail 25% / 62% (power4.out). Travel 556px up.
            Tail time (0.93s) is >3x the ramp-in (0.30s).                   */
      tl.fromTo("#f5-report", { y: 556 }, { y: 500, duration: 0.30, ease: "power3.in" }, 1.60);
      tl.to("#f5-report", { y: 139, duration: 0.27, ease: "none" }, 1.90);
      tl.to("#f5-report", { y: 0, duration: 0.93, ease: "power4.out" }, 2.17);

      /* ══ Scene 4 (3.4–5.0s) — the closing line writes in beside the
            report, and the baseline shortens toward centre for the lockup. */
      tl.fromTo("#f5-closing .f5-w",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.46, ease: "power3.out", stagger: 0.072 },
        3.44);

      /* handoff_out — rule settles to y=70%, x 36%–64%, opacity 1, scale 1,
         then holds static through the end of the frame.                   */
      tl.to("#f5-rule",
        { left: 691.2, width: 537.6, top: 756, duration: 0.90, ease: "power3.out" },
        3.55);

      window.__timelines["05-approve"] = tl;
    })();
