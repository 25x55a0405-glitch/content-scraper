    /* ── 04-figures-checked — Cartesian frame layer ──────────────────────────

    .f04-rule {

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ── Scene 1 (0.0–0.5s) ────────────────────────────────────────────────
         handoff_in: the 1px #E4E6E3 rule arrives at y=46%, x 14%–62%,
         opacity 1, scale 1, static. It holds for 3 frames, then EXTENDS
         rightward and settles as the stat's baseline —
         handoff_out: y=58%, x 10%–90%, opacity 1, scale 1, static.
         Tweened on left/top/width so no transform is ever applied: scale is
         literally 1 at both boundaries. Right edge travels 538px, left edge
         77px — the read is a rightward extension.                            */
      tl.set("#f04-rule", { x: 77, y: -129, scaleX: 0.599609 }, 0);
      tl.to(
        "#f04-rule",
        { x: 0, y: 0, scaleX: 1, duration: 0.42, ease: "power3.out" },
        0.05
      );

      /* ── Scene 2 (0.5–2.2s) — counting-dynamic-scale ───────────────────────
         "41" counts up from 0 above the baseline at display scale, tabular
         figures, transform scale growing with the value (0.55 → 1) on the SAME
         position + SAME ease, settling on a long tail. power3.out is monotonic
         and `snap` rounds to integers, so the counter can never overshoot 41
         and fall back. Final type size is static CSS — only the transform
         changes per frame; nothing writes font-size.
         The label is already set and does not animate.                        */
      var FIGURE = "#f04-figure";
      var COUNT_AT = 0.48;
      var COUNT_DUR = 1.7;

      tl.fromTo(FIGURE, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 0.36);

      tl.fromTo(
        FIGURE,
        { innerText: 0 },
        {
          innerText: 41,
          duration: COUNT_DUR,
          ease: "power3.out",
          snap: { innerText: 1 },
          immediateRender: false
        },
        COUNT_AT
      );

      tl.fromTo(
        FIGURE,
        { scale: 0.55 },
        { scale: 1, duration: COUNT_DUR, ease: "power3.out" },
        COUNT_AT
      );

      /* ── Scene 3 (2.2–3.3s) — waterfall-entry ──────────────────────────────
         "6 corrected before you saw them" whips in from below, one direction,
         opacity BINARY 0→1 via tl.set (never a fade). Anchors travel further
         and longer; gaps shrink across the cascade; the last word snaps.      */
      var F = 1 / 60;

      function whip(sel, at, offset, dur) {
        tl.set(sel, { opacity: 1, y: offset }, at);
        tl.to(sel, { y: 0, duration: dur, ease: "power4.out" }, at);
      }

      var t0 = 2.2;                 // "6" — anchor figure, heaviest
      whip("#f04-w1", t0, 72, 0.19);
      var t1 = t0 + 0.19 + 1 * F;   // 2 f gap → "corrected" (the green claim)
      whip("#f04-w2", t1, 66, 0.18);
      var t2 = t1 + 0.18 - 1 * F;   // overlap begins
      whip("#f04-w3", t2, 46, 0.15);
      var t3 = t2 + 0.15 - 1 * F;
      whip("#f04-w4", t3, 36, 0.13);
      var t4 = t3 + 0.13 - 2 * F;
      whip("#f04-w5", t4, 36, 0.12);
      var t5 = t4 + 0.12 - 2 * F;   // tightest overlap — the last word snaps
      whip("#f04-w6", t5, 50, 0.14);

      /* ── Scene 4 (3.3–4.5s) — held read, entirely still ────────────────────
         No tween after ~3.03s. No exit: this is not the final frame; the root
         transition is the exit.                                               */

      window.__timelines["04-figures-checked"] = tl;
      tl.seek(0);
    })();
