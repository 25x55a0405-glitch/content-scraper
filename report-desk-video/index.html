<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F6F6F4;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-twenty-clients"
        class="scene"
        data-composition-id="01-twenty-clients"
        data-composition-src="compositions/frames/01-twenty-clients.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-drafts-all-twenty"
        class="scene"
        data-composition-id="02-drafts-all-twenty"
        data-composition-src="compositions/frames/02-drafts-all-twenty.html"
        data-start="4.5"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-03-catches-its-mistake"
        class="scene"
        data-composition-id="03-catches-its-mistake"
        data-composition-src="compositions/frames/03-catches-its-mistake.html"
        data-start="10"
        data-duration="8"
        data-track-index="0"
      ></div>

      <div
        id="el-04-figures-checked"
        class="scene"
        data-composition-id="04-figures-checked"
        data-composition-src="compositions/frames/04-figures-checked.html"
        data-start="18"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-approve"
        class="scene"
        data-composition-id="05-approve"
        data-composition-src="compositions/frames/05-approve.html"
        data-start="22.5"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-lockup"
        class="scene"
        data-composition-id="06-lockup"
        data-composition-src="compositions/frames/06-lockup.html"
        data-start="27.5"
        data-duration="2.5"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-02-drafts-all-twenty", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.fromTo("#el-03-catches-its-mistake", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.to("#el-05-approve", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 27.5);
        tl.fromTo("#el-06-lockup", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 27.5);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
