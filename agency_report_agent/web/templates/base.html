<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Report Desk{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="wordmark" href="/">
      <span class="mark"><span></span></span>
      <b>Report Desk</b>
    </a>
    <div class="topbar-meta">
      <span>{{ agency.name }}</span>
      <span class="chip">{{ period }}</span>
    </div>
  </div>
</header>
<main class="page">
  {% block content %}{% endblock %}
</main>
</body>
</html>
